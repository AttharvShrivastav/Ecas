<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky & Atmosphere -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="40%" stop-color="#BFDBFE" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Warm Sunlight Flare -->
    <radialGradient id="sunFlare" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#FDE047" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Heavy Industrial Yellow Paint (Crane Body & Hook Block) -->
    <linearGradient id="yellowSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="yellowHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Heavy Forged Steel (Crane Hook & Shackles) -->
    <linearGradient id="forgedSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="wireRopeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Background Industrial Facility / Lattice Boom -->
    <linearGradient id="boomSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  <rect width="800" height="600" fill="url(#sunFlare)" />

  <!-- Distant Port / Construction Cranes Silhouettes in Background -->
  <g opacity="0.35">
    <rect x="0" y="480" width="800" height="120" fill="#64748B" />
    <polygon points="40,480 70,380 90,380 110,480" fill="#475569" />
    <rect x="75" y="375" width="220" height="12" fill="#475569" />
    <polygon points="520,500 560,340 580,340 610,500" fill="#475569" />
    <rect x="420" y="335" width="340" height="14" fill="#475569" />
    <line x1="570" y1="340" x2="740" y2="340" stroke="#334155" stroke-width="2" />
    <line x1="570" y1="340" x2="430" y2="340" stroke="#334155" stroke-width="2" />
  </g>

  <!-- Massive Crawler Crane Lattice Boom (Right Side) -->
  <g id="craneLatticeBoom" transform="translate(480, -40) rotate(18)">
    <!-- Main Chords -->
    <rect x="0" y="0" width="22" height="700" fill="url(#boomSteel)" />
    <rect x="110" y="0" width="22" height="700" fill="url(#boomSteel)" />
    <!-- Diagonal Lattice Lacings -->
    <path d="M10 40 L120 120 M120 120 L10 200 M10 200 L120 280 M120 280 L10 360 M10 360 L120 440 M120 440 L10 520 M10 520 L120 600 M120 600 L10 680" stroke="#9A3412" stroke-width="9" />
    <path d="M120 40 L10 120 M10 120 L120 200 M120 200 L10 280 M10 280 L120 360 M120 360 L10 440 M10 440 L120 520 M120 520 L10 600 M10 600 L120 680" stroke="#C2410C" stroke-width="7" />
    <!-- Horizontal Cross Members -->
    <line x1="10" y1="120" x2="120" y2="120" stroke="#EA580C" stroke-width="8" />
    <line x1="10" y1="280" x2="120" y2="280" stroke="#EA580C" stroke-width="8" />
    <line x1="10" y1="440" x2="120" y2="440" stroke="#EA580C" stroke-width="8" />
    <line x1="10" y1="600" x2="120" y2="600" stroke="#EA580C" stroke-width="8" />
  </g>

  <!-- Vertical Hoist Wire Ropes descending from top -->
  <g id="hoistCables">
    <line x1="190" y1="0" x2="190" y2="90" stroke="url(#wireRopeGrad)" stroke-width="8" />
    <line x1="210" y1="0" x2="210" y2="90" stroke="url(#wireRopeGrad)" stroke-width="8" />
    <line x1="230" y1="0" x2="230" y2="90" stroke="url(#wireRopeGrad)" stroke-width="8" />
    <line x1="250" y1="0" x2="250" y2="90" stroke="url(#wireRopeGrad)" stroke-width="8" />
    <line x1="270" y1="0" x2="270" y2="90" stroke="url(#wireRopeGrad)" stroke-width="8" />
  </g>

  <!-- Main Heavy Duty Crane Hook Block (Yellow Assembly) -->
  <g id="hookBlockAssembly">
    <!-- Top Sheave Housing Cover -->
    <rect x="150" y="80" width="160" height="50" rx="10" fill="url(#yellowSteel)" stroke="#92400E" stroke-width="3" />
    
    <!-- Sheave Wheels Side Plates -->
    <path d="M160 120 L140 230 Q140 250 165 250 L295 250 Q320 250 320 230 L300 120 Z" fill="url(#yellowHighlight)" stroke="#B45309" stroke-width="4" />
    
    <!-- Heavy Duty Bolting, Pins and Industrial Markings -->
    <circle cx="230" cy="180" r="32" fill="#1E293B" stroke="#475569" stroke-width="6" />
    <circle cx="230" cy="180" r="14" fill="#94A3B8" />
    
    <!-- Outer Flange Rivets -->
    <circle cx="170" cy="150" r="6" fill="#78350F" />
    <circle cx="160" cy="200" r="6" fill="#78350F" />
    <circle cx="180" cy="235" r="6" fill="#78350F" />
    <circle cx="290" cy="150" r="6" fill="#78350F" />
    <circle cx="300" cy="200" r="6" fill="#78350F" />
    <circle cx="280" cy="235" r="6" fill="#78350F" />

    <!-- Industrial SWL (Safe Working Load) Stencil Plate -->
    <rect x="190" y="140" width="80" height="22" rx="4" fill="#0F172A" />
    <rect x="195" y="145" width="70" height="12" fill="#E2E8F0" opacity="0.8" />

    <!-- Swivel Trunnion & Bearing Collar -->
    <rect x="200" y="250" width="60" height="35" rx="6" fill="url(#forgedSteel)" stroke="#334155" stroke-width="3" />
    <rect x="210" y="280" width="40" height="25" rx="4" fill="#0F172A" />
  </g>

  <!-- Massive Forged Crane Hook & Heavy Rigging Tackle -->
  <g id="forgedHookAndSlings">
    <!-- Hook Shank & Throat -->
    <!-- Curved Hook Profile -->
    <path d="M220 300 C220 340 170 360 170 420 C170 480 230 510 270 480 C300 455 310 410 300 370 C295 350 280 345 270 355 C260 365 265 385 270 405 C275 425 260 450 240 450 C210 450 205 420 215 390 C225 360 240 335 240 300 Z" fill="url(#forgedSteel)" stroke="#334155" stroke-width="3" />

    <!-- Safety Latch Mechanism -->
    <path d="M238 340 L285 380" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <circle cx="238" cy="340" r="4" fill="#FEF08A" />

    <!-- Heavy Master Link / Shackle on the Hook Bowl -->
    <path d="M205 430 C200 460 210 495 240 495 C270 495 275 460 265 430 Z" fill="none" stroke="#475569" stroke-width="16" stroke-linejoin="round" />
    <!-- Shackle Pin -->
    <rect x="195" y="420" width="80" height="14" rx="4" fill="#64748B" stroke="#1E293B" stroke-width="2" />

    <!-- Heavy Wire Rope Slings & Rigging Bridle Spreading Downwards -->
    <!-- Sling 1 Left -->
    <line x1="210" y1="450" x2="20" y2="600" stroke="url(#wireRopeGrad)" stroke-width="14" stroke-linecap="round" />
    <!-- Sling 2 Center-Left -->
    <line x1="225" y1="460" x2="160" y2="600" stroke="url(#wireRopeGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Sling 3 Center-Right -->
    <line x1="245" y1="460" x2="310" y2="600" stroke="url(#wireRopeGrad)" stroke-width="12" stroke-linecap="round" />
    <!-- Sling 4 Right -->
    <line x1="255" y1="450" x2="480" y2="600" stroke="url(#wireRopeGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Wire Rope Thimbles and Aluminum Ferrules -->
    <ellipse cx="215" cy="460" rx="8" ry="12" fill="#94A3B8" />
    <rect x="200" y="475" width="22" height="18" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="2" transform="rotate(-30 200 475)" />
    <rect x="245" y="475" width="22" height="18" rx="3" fill="#CBD5E1" stroke="#475569" stroke-width="2" transform="rotate(30 245 475)" />
  </g>
</svg>
